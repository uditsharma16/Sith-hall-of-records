<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a0f" />
  <meta name="description" content="The Sith Order Holocron Network — the Hall of Records." />
  <title>TSO — Holocron Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%230b0a0f' d='M0 0h64v64H0z'/%3E%3Cpath fill='none' stroke='%23c9a24d' stroke-width='4' stroke-linejoin='round' d='M32 8 56 50H8L32 8Zm0 0v42M8 50l24-16 24 16'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- app:start -->
  <div class="scene" aria-hidden="true">
    <div class="scene-glow scene-glow-crimson"></div>
    <div class="scene-glow scene-glow-amber"></div>
    <div class="scene-glow scene-glow-violet"></div>
    <div class="scene-prism"></div>
    <div class="scene-floor"></div>
    <canvas class="scene-motes" id="motes"></canvas>
    <div class="scene-aura"></div>
    <div class="scene-grain"></div>
  </div>
  <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <a class="brand" href="/" data-link aria-label="Holocron Network home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 7 57 51H7L32 7Z"/><path d="M32 7v44M7 51l25-17 25 17"/><circle cx="32" cy="38" r="3"/></svg>
      <span><strong>TSO</strong><small>Holocron Network</small></span>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false"><i></i><i></i></button>
    <nav class="main-nav" id="mainNav" aria-label="Primary navigation">
      <a class="nav-link" href="/" data-link>Network</a>
      <div class="sections-menu">
        <button class="nav-link" id="sectionsButton" aria-expanded="false">Vaults <span aria-hidden="true">▾</span></button>
        <div class="sections-popover" id="sectionsPopover"></div>
      </div>
      <a class="nav-link" href="/awards" data-link>Awards</a>
      <a class="nav-link" href="/leadership" data-link>Leadership</a>
      <button class="nav-link random-trigger" id="randomButton" title="Jump to a random holocron">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        <span>Random</span>
      </button>
      <button class="search-trigger" id="searchTrigger" aria-label="Search all holocrons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span>Search the network</span><kbd>/</kbd>
      </button>
      <span class="sync-pill" id="syncPill" data-state="connecting" title="Content is pulled from the Order's Trello board"><i></i><span id="syncStatus">Connecting</span></span>
    </nav>
  </header>

  <div class="search-panel" id="searchPanel" role="dialog" aria-modal="true" aria-label="Search the network" hidden>
    <div class="search-frame">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="globalSearch" type="search" placeholder="Search every holocron…" autocomplete="off" aria-label="Search every holocron" />
        <button id="closeSearch" aria-label="Close search">Esc</button>
      </div>
      <div class="search-results" id="searchResults"></div>
      <div class="search-hints"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span id="searchCount"></span></div>
    </div>
  </div>

  <main id="app" tabindex="-1">
    <div class="loading-page">
      <svg class="loader-sigil" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 7 57 51H7L32 7Z"/><path d="M32 7v44M7 51l25-17 25 17"/></svg>
      <p>Opening the network</p>
    </div>
  </main>

  <footer class="site-footer">
    <span>TSO · Holocron Network</span>
    <button type="button" class="fx-toggle" id="fxToggle" role="switch" aria-checked="false" aria-label="Lite effects" title="Lite effects: calmer background animation for slower devices">
      <span>Effects</span><span class="fx-toggle-track" aria-hidden="true"><i></i></span><span id="fxToggleState">Full</span>
    </button>
    <span id="footerSync">Source: Trello</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="lightbox" id="lightbox" hidden><button id="lightboxClose" aria-label="Close image">Close</button><img id="lightboxImage" alt="" /><p id="lightboxCaption"></p></div>
  <canvas class="hyperspace" id="hyperspace" aria-hidden="true"></canvas>

  <button type="button" class="droid" id="droid" data-state="connecting" data-side="right" data-vertical="bottom" aria-label="A wandering probe droid. Drag it to move it, or press for a status report." title="Drag me around">
    <span class="droid-float" aria-hidden="true">
      <span class="droid-glow"></span>
      <img class="droid-img" src="/droid.png" alt="" width="384" height="452" draggable="false" />
      <span class="droid-eye"></span>
    </span>
    <span class="droid-bubble" id="droidBubble" aria-live="polite"></span>
  </button>
  <!-- app:end -->

  <script src="/awards-data.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
